<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#060A08" />

    <!--
      Generic fallback tags only.

      The build prerenders a separate HTML file per route (src/prerender.tsx)
      and replaces everything below with tags describing that specific page —
      including its own canonical. Nothing here should be page-specific: this
      copy is what `vite dev` shows and what an unmatched path would serve.

      Previously this file carried a canonical pointing at the homepage and was
      served for all 21 routes, which told Google every page was a duplicate
      of / and should not be indexed on its own.
    -->
    <title>Eco AirTech — Nature's disinfectant, indoors and continuous</title>
    <meta
      name="description"
      content="Nature-based air technology for the UAE and GCC. ARC® hydroxyl systems that continuously treat the air and the surfaces around it."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eco AirTech" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
